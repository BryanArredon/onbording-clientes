# ==============================================================================
# ONBOARDING DE CLIENTES PERSONAS FISICAS :: APPLICATION PROPERTIES
# ==============================================================================

# Servidor HTTP
server.port=${PORT:${SERVER_PORT:8082}}
server.shutdown=graceful

# Spring 3.4 / Java 21 Virtual Threads
spring.threads.virtual.enabled=true
spring.application.name=onboarding-clientes

# Conexión a Base de Datos PostgreSQL (misma base de datos, esquema aislado)
# En Render: se compone la URL JDBC con PGHOST/PGPORT/PGDATABASE + SSL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:1050}/${PGDATABASE:dev_bryan}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:gestor_pagos}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:dev_bryan_postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.pool-name=OnboardingHikariPool
# Los triggers y funciones plpgsql usan nombres sin calificar (cliente, cuenta, secuencias):
# el search_path de la conexion debe incluir el esquema de onboarding.
spring.datasource.hikari.connection-init-sql=SET search_path TO onboarding_clientes, public
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Esquema Aislado de Base de Datos para Onboarding
spring.flyway.enabled=true
spring.flyway.schemas=onboarding_clientes
spring.flyway.default-schema=onboarding_clientes
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configuración JPA / Hibernate
spring.jpa.properties.hibernate.default_schema=onboarding_clientes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Documentación OpenAPI 3.0 / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator / Métricas
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized

# ==============================================================================
# Propiedades de Negocio de Onboarding
# ==============================================================================
onboarding.cuenta.saldo-inicial=0.00
onboarding.cuenta.moneda=MXN
onboarding.cuenta.tipo=AHORRO
onboarding.cuenta.permitir-saldo-en-peticion=true

onboarding.seguridad.longitud-minima-pin=4
onboarding.seguridad.longitud-maxima-pin=6
onboarding.seguridad.intentos-maximos=5
onboarding.seguridad.minutos-bloqueo=15
onboarding.seguridad.longitud-minima-contrasenia=8

onboarding.paginacion.limite-por-defecto=20
onboarding.paginacion.limite-maximo=100

onboarding.token.emisor=onboarding-clientes
onboarding.token.secreto=${JWT_SECRET:fnw291pLQ3PijpnlOZFtaJD3a5xp+K6oZRCW7mzZyAuAl/hGaT79QZfOMuZIfnnB}
onboarding.token.duracion-acceso=PT15M
onboarding.token.duracion-refresh=P7D

onboarding.keycloak.habilitado=false
onboarding.keycloak.emisor=http://localhost:8081/realms/onboarding
onboarding.keycloak.uri-jwks=http://localhost:8081/realms/onboarding/protocol/openid-connect/certs
onboarding.keycloak.audiencia=onboarding-api
